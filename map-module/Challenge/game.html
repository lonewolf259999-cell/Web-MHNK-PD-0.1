<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MHNK PD // GEO-CHALLENGE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <link rel="stylesheet" href="/map-module/src/map-style.css?v=8" />
  <link rel="stylesheet" href="/map-module/Challenge/src/game-style.css?v=1" />
</head>
<body>
  <!-- BOOT SCREEN -->
  <div class="mhnk-boot" id="mhnk-boot">
    <div class="mhnk-boot-grid"></div>
    <div class="mhnk-boot-inner">
      <div class="mhnk-boot-badge"><img class="mhnk-boot-logo" src="/logo.gif" alt="MHNK"></div>
      <h1 class="mhnk-boot-title">MHNK<span>·PD</span></h1>
      <div class="mhnk-boot-sub">GEO-CHALLENGE TERMINAL</div>
      <div class="mhnk-boot-bar"><div class="mhnk-boot-fill" id="mhnk-boot-fill"></div></div>
      <div class="mhnk-boot-status" id="mhnk-boot-status">LOADING SATELLITE DATA…</div>
    </div>
  </div>

  <div class="game-page">
    <!-- TOP BAR -->
    <header class="game-topbar">
      <div class="game-brand">
        <span class="game-logo"><img class="game-logo-img" src="/logo.gif" alt="MHNK"></span>
        <div class="game-brand-text">
          <div class="game-title">MHNK<span>·PD</span></div>
          <div class="game-sub">GEO-CHALLENGE</div>
        </div>
      </div>
      <div class="game-stats">
        <div class="game-stat">
          <span class="game-stat-label">ROUND</span>
          <span class="game-stat-value" id="game-round">0/50</span>
        </div>
        <div class="game-stat">
          <span class="game-stat-label">SCORE</span>
          <span class="game-stat-value" id="game-score">0</span>
        </div>
        <div class="game-stat">
          <span class="game-stat-label">TIME</span>
          <span class="game-stat-value" id="game-timer">30</span>
        </div>
      </div>
      <button class="game-exit-btn" onclick="GAME.exit()">✕ EXIT</button>
    </header>

    <!-- MAIN AREA -->
    <main class="game-main">
      <div id="game-map"></div>
      <div class="mhnk-vignette"></div>
      <div class="mhnk-crosshair">
        <div class="mhnk-crosshair-circle"></div>
        <div class="mhnk-crosshair-h"></div>
        <div class="mhnk-crosshair-v"></div>
      </div>

      <!-- QUESTION PANEL -->
      <div class="game-question-panel" id="game-question">
        <div class="game-question-tag">◢ LOCATE TARGET</div>
        <div class="game-question-name" id="game-question-name">---</div>
        <div class="game-question-desc" id="game-question-desc"></div>
      </div>

      <!-- RESULT OVERLAY -->
      <div class="game-result-overlay" id="game-result" style="display:none;">
        <div class="game-result-box">
          <div class="game-result-tag">◢ TARGET LOCATED</div>
          <div class="game-result-target" id="game-result-target"></div>
          <div class="game-result-info">
            <div class="game-result-row">
              <span class="game-result-label">YOUR CLICK</span>
              <span class="game-result-value" id="game-result-click">-</span>
            </div>
            <div class="game-result-row">
              <span class="game-result-label">DISTANCE</span>
              <span class="game-result-value" id="game-result-distance">-</span>
            </div>
            <div class="game-result-row game-result-score-row">
              <span class="game-result-label">POINTS</span>
              <span class="game-result-value game-result-score" id="game-result-points">0</span>
            </div>
          </div>
          <button class="game-next-btn" id="game-next-btn" onclick="GAME.nextRound()">NEXT TARGET ▸</button>
        </div>
      </div>
    </main>
  </div>

  <!-- FINAL SCREEN -->
  <div class="game-final-overlay" id="game-final" style="display:none;">
    <div class="game-final-box">
      <div class="game-final-badge">🏆</div>
      <div class="game-final-title">MISSION COMPLETE</div>
      <div class="game-final-score" id="game-final-score">0</div>
      <div class="game-final-grade" id="game-final-grade">F</div>
      <div class="game-final-details" id="game-final-details"></div>
      <div class="game-final-actions">
        <button class="game-final-btn" onclick="GAME.restart()">↻ PLAY AGAIN</button>
        <button class="game-final-btn game-final-btn-ghost" onclick="GAME.exit()">✕ BACK TO MAP</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="/map-module/Challenge/src/game-core.js?v=1"></script>
  <script>
    (function boot() {
      var steps = [
        'DECRYPTING SATELLITE FEED…',
        'LOADING TARGET DATABASE…',
        'CALIBRATING GEO-SENSORS…',
        'SYNCING COORDINATES…',
        'CHALLENGE READY'
      ];
      var i = 0;
      var fill = document.getElementById('mhnk-boot-fill');
      var status = document.getElementById('mhnk-boot-status');
      function tick() {
        i++;
        var pct = Math.min(i / 12, 1);
        fill.style.width = (pct * 100) + '%';
        if (i % 3 === 0) status.textContent = steps[Math.min(Math.floor(i / 3), steps.length - 1)];
        if (pct < 1) {
          setTimeout(tick, 80);
        } else {
          setTimeout(function() {
            document.getElementById('mhnk-boot').classList.add('done');
            GAME.start();
          }, 300);
        }
      }
      setTimeout(tick, 200);
    })();
  </script>
</body>
</html>
