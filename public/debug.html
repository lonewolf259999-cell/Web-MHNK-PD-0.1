<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEBUG - เวลาการเชื่อมต่อ Discord</title>
<style>
  body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 18px 16px; color: #111827; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 14px; }
  .bar { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  button { background:#111827; color:#fff; border:0; padding:9px 14px; border-radius:8px; cursor:pointer; font-size:14px; }
  button.outline { background:#fff; border:1px solid #d1d5db; color:#111827; }
  .status { font-size:13px; font-weight:600; padding:6px 10px; border-radius:8px; display:inline-block; }
  .ok { background:#dcfce7; color:#14532d; }
  .fail { background:#fee2e2; color:#7f1d1d; }
  .idle { background:#f3f4f6; color:#374151; }
  .running { background:#fef9c3; color:#714e15; }
  pre { background:#0b1220; color:#d1fae5; padding:12px; border-radius:8px; overflow:auto; font-size:12.5px; line-height:1.5; max-height:72vh; }
  .empty { color:#9ca3af; }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:4px 6px; font-size:12.5px; border-bottom:1px solid #1f2937; }
  th { color:#9ca3af; }
</style>
</head>
<body>
  <h1>DEBUG — เวลาการเชื่อมต่อ Discord</h1>
  <div class="sub">บันทึกเหตุการณ์เรียกจากเซิร์ฟเวอร์ (server → discord) แบบเรียนว่างี้ ใช้ debug ชั่วคราว</div>

  <div class="bar">
    <button id="openOAuth">เปิดหน้าเชื่อมต่อ Discord (หน้าต่างใหม่)</button>
    <button class="outline" id="clearBtn">ล้าง Log</button>
    <span id="status" class="status idle">ยังไม่มีการเชื่อมต่อ</span>
  </div>

  <pre id="box"><div class="empty">ยังไม่มีเหตุการณ์ — กด “เปิดหน้าเชื่อมต่อ Discord” แล้วอนุญาตต่อ</div></pre>

<script>
let poll = null;
const box = document.getElementById('box');
const statusEl = document.getElementById('status');

function fmt(ms) {
  const d = new Date(ms);
  return d.toLocaleTimeString('th-TH', { hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit' }) + '.' + String(d.getMilliseconds()).padStart(3,'0');
}

function renderLog(events) {
  if (!events || !events.length) { box.textContent = 'ยังไม่มีเหตุการณ์ — กด “เปิดหน้าเชื่อมต่อ Discord” แล้วอนุญาตต่อ'; return; }
  const rows = events.map(e => {
    const kv = Object.entries(e).filter(([k]) => k !== 't').map(([k,v]) => k+'='+ (typeof v === 'object' ? JSON.stringify(v) : v));
    let cls='';
    if (e.outcome === 'ok') cls='ok'; else if (e.outcome === 'failed') cls='fail';
    return '<tr><td>'+fmt(e.t)+'</td><td>'+(e.step||'')+'</td><td class="'+cls+'">'+kv.join(' | ')+'</td></tr>';
  });
  box.innerHTML = '<table><thead><tr><th>เวลา</th><th>ขั้นตอน</th><th>รายละเอียด/สถานะ</th></tr></thead><tbody>'+rows.join('')+'</tbody></table>';
  box.scrollTop = box.scrollHeight;
}

function refreshStatus(events) {
  const last = events[events.length-1];
  if (!last) { statusEl.textContent = 'ยังไม่มีการเชื่อมต่อ'; statusEl.className='status idle'; return; }
  if (last.step === 'redirect' && last.outcome === 'success') {
    statusEl.textContent = 'เชื่อมต่อสำเร็จแล้ว'; statusEl.className='status ok';
  } else if (last.step === 'redirect' && last.outcome === 'failed') {
    statusEl.textContent = 'เชื่อมต่อล้มเหลว (ดู Log)'; statusEl.className='status fail';
  } else if (last.step === 'callback_error' || (last.step==='exchange' && last.outcome==='failed')) {
    statusEl.textContent = 'เซิร์ฟเวอร์เชื่อมต่อ Discord ผิดพลาด (ดู Log)'; statusEl.className='status fail';
  } else {
    statusEl.textContent = 'กำลังเชื่อมต่อ... ('+last.step+')'; statusEl.className='status running';
  }
}

async function pollOnce() {
  try {
    const r = await fetch('/debug/timeline', { cache: 'no-store' });
    const j = await r.json();
    renderLog(j);
    refreshStatus(j);
  } catch (e) {
    box.textContent = 'โหลด timeline ไม่ได้: ' + e;
    statusEl.textContent='เกิดข้อผิดพลาด'; statusEl.className='status fail';
  }
}

poll = setInterval(pollOnce, 500);
pollOnce();

document.getElementById('openOAuth').onclick = () => {
  window.open('https://mhnk-pd.inwcloud.com/auth/discord?state=register', '_blank', 'width=480,height=720,noopener=0,noreferrer=0');
};
document.getElementById('clearBtn').onclick = async () => {
  await fetch('/debug/timeline/clear');
  box.textContent = ''; statusEl.textContent='ล้างแล้ว'; statusEl.className='status idle';
  pollOnce();
};
</script>
</body>
</html>
