<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติเจ้าหน้าที่ - MHNK Police Department</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="src/styles/main.css" />
    <link rel="stylesheet" href="src/styles/admin.css" />
</head>
<body>
    <div class="scanner-line"></div>
    <div class="bg-glow"></div>
    <div class="bg-dots"></div>

    <header class="site-header">
        <div class="header-top">
            <a href="index.html" class="back-link">
                <span class="back-icon">&#8592;</span>
                <span class="back-text">กลับ</span>
            </a>
            <img src="logo.gif" alt="MHNK PD Logo" class="header-logo" onerror="this.src='logo.png'">
            <div class="header-title">
                <h1>ประวัติเจ้าหน้าที่</h1>
                <div class="header-subtitle">กรมตำรวจ <span>MHNK</span> &mdash; Mahahorn Diwa</div>
            </div>
            <div class="header-badges">
                <span class="header-badge">&#9670; PROFILE</span>
                <span class="header-badge">&#9878; POLICE</span>
            </div>
        </div>
    </header>

    <main class="profile-main">
        <div class="profile-card">
            <div class="profile-loading" id="profileLoading">
                <div class="loader"></div>
                <p>กำลังโหลดข้อมูล...</p>
            </div>

            <div id="profileContent" style="display: none;">
                <div class="profile-hero">
                    <h2 class="profile-name" id="profileName">-</h2>
                    <span class="profile-dept" id="profileDept">-</span>
                    <div class="profile-total-stats" id="profileTotalStats" style="display:none;">
                        <div class="total-stats-row">
                            <div class="total-stat-item">
                                <span class="total-stat-label">รวมคดีทั้งหมด</span>
                                <span class="total-stat-value" id="totalCasesAll">0</span>
                            </div>
                            <div class="total-stat-item">
                                <span class="total-stat-label">รวม Take 2</span>
                                <span class="total-stat-value" id="totalTake2All">0</span>
                            </div>
                            <div class="total-stat-item">
                                <span class="total-stat-label">รวมคุมสอบ</span>
                                <span class="total-stat-value" id="totalInterAll">0</span>
                            </div>
                        </div>
                    </div>
                    <div class="week-selector-container" id="weekSelector"></div>
                </div>

                <div class="profile-body">
                    <div class="week-data-wrapper">
                        <div id="weekData"></div>
                    </div>
                </div>
            </div>

            <div class="profile-error" id="profileError" style="display: none;">
                <p>ไม่พบข้อมูลเจ้าหน้าที่</p>
                <div class="error-actions">
                <a href="index.html" class="btn btn-primary">กลับหน้าหลัก</a>
                    <button onclick="location.reload()" class="btn btn-primary">รีเฟรช</button>
            </div>
        </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 <span>MHNK POLICE DEPARTMENT</span> &mdash; FiveM Server</p>
    </footer>

    <!-- Production flag -->
    <script>
        window.__PRODUCTION__ = !window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1');
    </script>
    
    <script src="src/utils/html.js?v=2.1.0"></script>
    <script src="src/utils/api.js?v=2.1.0"></script>
    <script src="src/utils/NotificationSystem.js?v=2.1.0"></script>
    <script src="src/components/shared/PinModal.js"></script>
    <script src="src/profile/WeekSelector.js?v=2.1.0"></script>
    <script src="src/profile/WeekStatsRenderer.js?v=2.1.0"></script>
    <script src="src/profile/PaymentManager.js?v=2.1.0"></script>
    <script src="src/profile/ProfilePage.js?v=2.1.0"></script>
</body>
</html>
